name: CI Build & Test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/pds

jobs:
  build-and-test:
    name: Build, Test & Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - config-service
          - discovery-service
          - gateway-service
          - auth-service
          - clinic-service
          - medical-service
          - consultation-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          mvn clean compile -DskipTests -B

      - name: Run Unit Tests for ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          mvn test -B
        continue-on-error: false

      - name: Package ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          mvn package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:1.0.0-RC1
            ${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pds_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Integration Tests
        run: |
          for service in config-service discovery-service gateway-service auth-service clinic-service medical-service consultation-service; do
            echo "Running integration tests for $service"
            cd $service
            mvn verify -DskipUnitTests -B || true
            cd ..
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
